---
services:
  db:
    image: modasai/python_libapp:db
    ports:
      - 3306:3306
    networks:
      - my_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      
  auth_service:
    image: modasai/python_libapp:auth
    ports:
      - 5001:5001
    networks:
      - my_network
    depends_on:
        - db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      
  book_service:
    image: modasai/python_libapp:book
    ports:
      - 5002:5002
    networks:
      - my_network
    depends_on:
        - db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
  borrow_service:
    image: modasai/python_libapp:borrow
    ports:
      - 5003:5003
    networks:
      - my_network
    depends_on:
        - db
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
  app_service:
    image: modasai/python_libapp:app
    ports:
      - 5000:5000
    networks:
      - my_network
    depends_on:
        - auth_service
        - book_service
        - borrow_service
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      

networks:
  my_network:
    driver: overlay
